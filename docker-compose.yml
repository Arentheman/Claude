# Reference compose file for a future hosted deployment with PostgreSQL.
# Local usage doesn't need this — `dotnet run` with SQLite is enough.
services:
  web:
    build: .
    ports:
      - "8080:8080"
    environment:
      Database__Provider: Postgres
      ConnectionStrings__Default: "Host=db;Database=dungeonmaster;Username=dma;Password=${DB_PASSWORD:?set DB_PASSWORD}"
      App__OpenBrowserOnStart: "false"
    volumes:
      - dma-uploads:/app/uploads
    depends_on:
      - db

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: dungeonmaster
      POSTGRES_USER: dma
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
    volumes:
      - dma-postgres-data:/var/lib/postgresql/data

volumes:
  dma-postgres-data:
  dma-uploads:
