name: Build NeuroJumper.exe

on:
  push:
    paths:
      - "telegram-jump-bot/**"
      - ".github/workflows/build-jump-bot.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: telegram-jump-bot
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install numpy opencv-python-headless mss pynput pydirectinput pillow pyinstaller dxcam

      - name: Smoke test
        run: python -c "import bot, gui; import numpy as np; g = np.zeros(bot.NG); print(bot.decide(g, np.zeros(bot.NI)))" && python -c "import dxcam; print('dxcam', dxcam.__name__)"

      - name: Build exe
        run: >
          pyinstaller --noconfirm --onefile --windowed --name NeuroJumper
          --add-data "pretrained.json;." --add-data "sprites;sprites"
          --hidden-import pynput.keyboard._win32 --hidden-import pynput.mouse._win32
          --collect-all dxcam --collect-submodules comtypes
          gui.py

      - uses: actions/upload-artifact@v4
        with:
          name: NeuroJumper
          path: telegram-jump-bot/dist/NeuroJumper.exe

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: neurojumper-${{ github.run_number }}
          name: NeuroJumper ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: telegram-jump-bot/dist/NeuroJumper.exe
          body: "Скачайте NeuroJumper.exe и запустите. Python не нужен."
